name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Organize Android folders and resources
        run: |
          PKG=$(grep -m 1 "^package " MainActivity.java | sed 's/package //;s/;//' | tr -d '\r ')
          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p "app/src/main/res/drawable"

          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java "app/src/main/java/$PKG_PATH/"

          if [ -f "ic_launcher.png" ]; then
            python3 -c "from PIL import Image; Image.open('ic_launcher.png').resize((512, 512)).save('app/src/main/res/drawable/ic_launcher.png', 'PNG')" 2>/dev/null || cp ic_launcher.png app/src/main/res/drawable/ic_launcher.png
          fi

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '$PKG'
              compileSdk 34
              defaultConfig {
                  applicationId "$PKG"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LGRemote-apk
          path: app/build/outputs/apk/debug/*.apk


