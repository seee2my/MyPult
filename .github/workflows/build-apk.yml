name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Organize Android folders
        run: |
          mkdir -p app/src/main/java/com/example/lgremote
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.java app/src/main/java/com/example/lgremote/
          mv build.gradle app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LGRemote-apk
          path: app/build/outputs/apk/debug/*.apk
